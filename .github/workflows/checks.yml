name: Artifact checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest
      - run: python -m pcoc.demo
      - run: python -m pcoc plan --config configs/outer_ranking.json --job 1 --list
      - run: python -m pcoc matrix --config configs/robustness.json
      - run: python -m pcoc.analysis --help
      - run: python -m pcoc.recovery --help
      - run: python -m legacy --help
